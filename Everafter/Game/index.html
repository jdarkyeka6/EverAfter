function rememberStoryChoice(event,choiceIndex){
  const arc=STORY_ARCS[event.title];
  if(!arc)return;
  if(!Array.isArray(s.storyThreads))s.storyThreads=[];
  if(s.storyThreads.some(thread=>thread.origin===event.title))return;
  s.storyThreads.push({origin:event.title,choice:choiceIndex,dueAge:s.age+arc.delay,seen:false});
}
function selectUnseenLifeEvent(){
  // Continue old save files without repeating incidents that already occurred.
  if(!Array.isArray(s.eventHistory)){
    s.eventHistory=EVENTS.filter(e=>s.log.some(entry=>entry.text?.startsWith('✨ '+e.title+':'))).map(e=>e.title);
  }
  const seen=new Set(s.eventHistory);
  if(Array.isArray(s.storyThreads)){
    const thread=s.storyThreads.find(t=>!t.seen&&t.dueAge<=s.age&&STORY_ARCS[t.origin]);
    if(thread){
      thread.seen=true;
      const arc=STORY_ARCS[thread.origin];
      if(!seen.has(arc.title)){
        s.eventHistory.push(arc.title);
        return {icon:arc.icon,title:arc.title,desc:arc.descs[thread.choice]||arc.descs[0],options:arc.options,storyFollowup:true};
      }
    }
  }
  const available=EVENTS.filter(e=>(!e.min||s.age>=e.min)&&(!e.max||s.age<=e.max)&&(!e.when||e.when())&&!seen.has(e.title));
  if(!available.length)return null;
  const selected=pick(available);
  s.eventHistory.push(selected.title);
  return selected;
}
function dialog(title,icon,body,choices=[],wide=false){modal={title,icon,body,choices,wide};renderModal()}
function closeDialog(){modal=null;renderModal()}
function choose(title,icon,body,options){const key=activeActionKey;dialog(title,icon,body,options.map(o=>({text:o.text,hint:o.hint,fn:()=>{closeDialog();withActionContext(key,()=>o.fn())}})))}
function requireAge(n){if(s.age<n){fail(`Available from age ${n}.`);return false}return true}
function checkFree(){if(s.prison>0){fail(`You are incarcerated for another ${s.prison} year(s). Use the Justice menu.`);return false}return true}
function rel(id){return s.relationships.find(x=>x.id===Number(id))}
function act(id,value,extra){if(!s&&id!=='newLife')return;ensureExpansions(s);switch(id){
 case 'age':ageUp();return;
 case 'discoveryActivity':doDiscoveryActivity(value);return;
 case 'discoveryProject':doDiscoveryProject(value);return;

function applyJob(jobId){if(!requireAge(18)||!checkFree())return;const j=JOBS.find(j=>j.id===jobId);if(!j)return;let req='';const deg=j.req;if(deg.startsWith('special:')){const t=deg.split(':')[1];const skillName=t==='looks'?'looks':t;if(t==='looks'&&s.stats.looks<j.min)req=`Needs looks ${j.min}+`;else if(t==='social'&&s.followers<20000)req='Needs 20,000 followers';else if(t!=='looks'&&t!=='social'&&(s.skills[skillName]||0)<65)req=`Needs ${skillName} skill 65+`;}else if(deg!=='none'&&!s.degrees.includes(deg))req=`Requires degree in ${deg}`;
 if(j.id==='astronaut'&&s.stats.fitness<80)req='Needs fitness 80+';if(s.criminalRecord>1&&(j.id==='police'||j.id==='diplomat'))req='Criminal record disqualifies applicant';if(s.age<21&&j.tier>=4)req='Minimum age 21';if(req)return fail(req);
 doAct(1,()=>{if(s.job?.id===j.id)return false;const rate=cap(83-(j.tier*13)+(s.stats.smart-55)*.35+s.stats.reputation*.22+s.skills.business*.1,16,95);if(!chance(rate))return`📄 ${j.name} application unsuccessful. Keep improving your credentials.`;if(s.job)s.jobHistory.push({...s.job});const bonus=(s.degree&&j.tier>2?.18:0)+s.stats.smart/420;s.job={id:j.id,name:j.name,icon:j.icon,salary:Math.round(j.salary*countryObj(s.country)[3]*(1+bonus)),performance:rand(45,68),years:0};stat('happy',5);return`🎉 Hired as ${j.name} at ${cash(s.job.salary)} per year!`});}

function bizAction(uid,mode){const b=s.businesses.find(x=>String(x.uid)===String(uid));if(!b)return;if(mode==='sell'){choose('Sell company?','🏢',`Sell ${esc(b.name)} for its estimated valuation of ${cash(b.value)}?`,[{text:'Sell company',fn:()=>{s.cash+=b.value;s.businesses=s.businesses.filter(x=>x!==b);commit(`💰 You sold ${b.name} for ${cash(b.value)}.`)}},{text:'Keep building',fn:()=>{}}]);return}doAct(1,()=>{const prices={market:2500,quality:5000,hire:12000,expand:30000};if(!spend(prices[mode]||0))return false;if(mode==='market'){b.marketing=cap(b.marketing+25);return`📣 Ran a marketing campaign for ${b.name}.`}if(mode==='quality'){b.quality=cap(b.quality+17);return`✨ Improved product quality at ${b.name}.`}if(mode==='hire'){b.staff++;return`👥 Hired another employee for ${b.name}.`}if(mode==='expand'){b.level++;b.revenue=Math.round(b.revenue*1.32);b.value=Math.round(b.value*1.18);return`🏗️ Expanded ${b.name} to level ${b.level}!`}return false})}
function createArt(kind){if(!requireAge(16)||!checkFree())return;doAct(1,()=>{if(!spend(300))return false;const k=kind==='art'?'art':kind==='game'?'coding':kind==='movie'?'acting':'writing';skill(k,8);const revenue=Math.round(rand(200,4200)*(1+s.skills[k]/40)*(1+s.stats.fame/60));s.cash+=revenue;s.creations++;stat('fame',rand(0,6));return`${({art:'🎨 You sold your artwork',game:'🎮 You launched an indie game',movie:'🎞️ You released a short film',podcast:'🎙️ You released a podcast episode'})[kind]||'🎨 You created something'} and earned ${cash(revenue)}.`})}
function campaign(id){if(!requireAge(22)||!checkFree())return;const o=OFFICES.find(x=>x.id===id);if(!o)return;if(s.age<o.minAge)return fail(`You must be at least ${o.minAge} years old.`);if(s.criminalRecord>=3)return fail('Your criminal record prevents you from standing in this election.');if(s.office)return fail('You already hold an elected office.');doAct(2,()=>{if(!spend(o.cost))return false;const score=s.skills.politics*.42+s.stats.reputation*.38+s.stats.fame*.12+s.followers/350000+s.stats.karma*.1-rand(15,55)-s.scandal*.5+28-o.tier*7;const won=chance(cap(score,5,91));if(won){s.office={id:o.id,name:o.name,salary:o.salary,years:0};s.approval=rand(48,74);stat('fame',rand(7,14));stat('reputation',10);return`🗳️ ELECTION VICTORY! You became ${o.name}, earning ${cash(o.salary)} per year.`}stat('reputation',-3);return `📉 You lost the election for ${o.name}. The campaign cost ${cash(o.cost)}.`})}
function crimeAction(id){if(!requireAge(14))return;if(s.prison>0)return fail('You are already in custody.');const CRIMES={graffiti:{title:'Public vandalism',gain:[0,30],risk:32,years:[0,1],rep:8},shoplift:{title:'Petty theft',gain:[100,600],risk:30,years:[0,2],rep:6},fraud:{title:'Financial fraud',gain:[3000,30000],risk:60,years:[1,8],rep:18},heist:{title:'Grand theft',gain:[12000,80000],risk:75,years:[3,13],rep:28},cyber:{title:'Digital fraud',gain:[2000,42000],risk:64,years:[2,9],rep:17}};const crime=CRIMES[id];if(!crime)return;doAct(2,()=>{s.crimeCount++;const detected=chance(cap(crime.risk-s.stats.smart*.16,12,90));stat('karma',-rand(4,15));stat('reputation',-crime.rep);if(detected){const sentence=rand(...crime.years);s.criminalRecord++;s.prison=sentence;s.scandal+=rand(2,11);const fine=rand(100,1400)*Math.max(1,s.criminalRecord);s.cash=Math.max(0,s.cash-fine);if(sentence<=0)return`🚓 You were caught for ${crime.title.toLowerCase()} and fined ${cash(fine)}.`;return`🚨 You were caught for ${crime.title.toLowerCase()} and sentenced to ${sentence} year(s) in prison.`}const reward=rand(...crime.gain);s.cash+=reward;return `🕵️ You got away with ${crime.title.toLowerCase()} and gained ${cash(reward)}. Consequences may catch up.`})}
function prisonAction(id){if(s.prison<=0)return fail('You are not in prison.');doAct(1,()=>{if(id==='education'){stat('smart',8);stat('reputation',2);return'📚 You completed a prison education program.'}if(id==='good'){s.prison=Math.max(0,s.prison-(chance(50)?1:0));stat('karma',7);if(s.prison===0)s.flags.served=true;return'🤝 You helped others and were considered for early release.'}if(id==='appeal'){if(!spend(850))return false;if(chance(22+s.stats.smart*.27)){s.prison=Math.max(0,s.prison-rand(1,3));if(s.prison===0)s.flags.served=true;return'⚖️ A judge reduced your sentence after a successful appeal.'}return'⚖️ Your appeal was denied.'}if(id==='exercise'){stat('fitness',9);stat('health',5);return'🏋️ You exercised during your sentence.'}return false})}
function casino(mode){if(!requireAge(18)||!checkFree())return;const bet=Number(mode)||100;if(s.cash<bet)return fail(`You need ${cash(bet)} to play.`);doAct(1,()=>{s.cash-=bet;const won=chance(46);if(won){s.cash+=bet*2;stat('happy',5);return`🎰 You won ${cash(bet)} at the fictional casino!`}s.flags.gambleLoss=true;stat('happy',-4);return`🎰 You lost ${cash(bet)}. The house won this time.`})}
function rewind(){if(!s.snapshots.length)return fail('No saved year snapshots. Age up first.');choose('Rewind time?','🕰️','Return to a previous year. Creator Mode keeps this ability completely free. The current year will be replaced.',s.snapshots.slice(0,6).map((h,i)=>({text:`Return to age ${h.age}`,hint:`${h.year} • ${cash(h.cash)} • ${h.name}`,fn:()=>{const existing=s.snapshots;const reset=objcopy(h);reset.snapshots=existing.slice(i+1);reset.flags.rewound=true;s=reset;commit(`🕰️ Time travelled back to age ${s.age}!`)}})))}
function saveSlot(i){const slots=JSON.parse(storage.getItem(SLOTS)||'{}');slots[i]=objcopy({...s,snapshots:s.snapshots.slice(0,3)});try{storage.setItem(SLOTS,JSON.stringify(slots));showToast(`💾 Saved ${s.name} to slot ${Number(i)+1}.`);render()}catch(e){fail('Storage is full. Export your save and clear a slot.')}}

function deleteSlot(i){const slots=JSON.parse(storage.getItem(SLOTS)||'{}');if(!slots[i])return;choose('Delete save slot?','🗑️','This removes the selected backup save.',[{text:'Delete this slot',fn:()=>{delete slots[i];storage.setItem(SLOTS,JSON.stringify(slots));showToast('Save slot cleared.');render()}},{text:'Cancel',fn:()=>{}}])}
function exportSave(){if(!s)return;const blob=new Blob([JSON.stringify({everafter:true,save:s},null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=`Everafter_${s.name.replace(/[^a-z0-9]/gi,'_')}_age${s.age}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());const state=d?.everafter?d.save:d;if(state?.version!==1||!state.stats||!Array.isArray(state.relationships)||!Array.isArray(state.log))throw Error('Not a valid Everafter save.');s=state;tab='home';save();render();showToast('💾 Save imported!')}catch(err){fail(err.message)}e.target.value=''});

function underworldAction(mode){if(!requireAge(18))return;if(mode==='join'){doAct(1,()=>{if(s.underworld)return false;if(s.prison>0)return false;s.underworld={rank:1,trust:30,heat:10,crew:1};stat('karma',-8);return '🎩 You joined a fictional underground syndicate as an associate.'});return}if(!s.underworld)return fail('You have not joined the underworld.');if(mode==='leave'){choose('Walk away?','🕶️','Leaving this fictional syndicate lowers your reputation, but ends your ongoing involvement.',[{text:'Leave for good',fn:()=>{s.underworld=null;stat('karma',10);commit('🕊️ You left the syndicate behind.')}},{text:'Stay involved',fn:()=>{}}]);return}
 if(s.prison>0)return fail('Your crew cannot act while you are incarcerated.');const u=s.underworld;

function agencyAction(mode){if(!requireAge(18))return;if(mode==='start'){doAct(1,()=>{if(s.agency)return false;if(!spend(85000))return false;s.agency={name:'Nightglass Intelligence',agents:1,tech:1,prestige:20,missions:0};return '🕶️ You founded Nightglass Intelligence, a fictional security agency.'});return}const ag=s.agency;if(!ag)return fail('Launch your own intelligence agency first.');doAct(1,()=>{if(mode==='hire'){if(!spend(12000))return false;ag.agents++;return`🧑‍💼 Hired a new analyst. Nightglass now has ${ag.agents} agents.`}if(mode==='tech'){if(!spend(30000))return false;ag.tech++;return`🛰️ Upgraded agency technology to level ${ag.tech}.`}if(mode==='briefing'){ag.prestige=cap(ag.prestige+rand(4,9));skill('politics',3);return'🕶️ You conducted an intelligence briefing and improved agency prestige.'}if(mode==='mission'){const budget=5000+ag.agents*1500;if(!spend(budget))return false;const success=chance(cap(30+ag.agents*5+ag.tech*12+ag.prestige*.25,9,93));ag.missions++;if(success){const pay=rand(15000,60000)*(ag.tech+1);s.cash+=pay;ag.prestige=cap(ag.prestige+8);return`🛰️ A fictional protective-intelligence mission succeeded, earning ${cash(pay)}.`}ag.prestige=cap(ag.prestige-7);return '🕶️ The agency contract failed. The client was disappointed.'}return false});}

lish','','1 AP'),actionCard('💝','Contribute funds','Add money to society treasury','society','donate','','1 AP • $2,000'),actionCard('🏛️','Upgrade headquarters','Invest society treasury','society','upgrade','','1 AP')])}`:grid([actionCard('🔭','Create your society','Astronomy, art, nature, history and philosophy clubs','society','start','','1 AP • $5,000')]))+section('🕶️ Private intelligence agency',s.agency?`<div class="panel glass"><div class="item-name">🕶️ ${esc(s.agency.name)}</div><p class="tip">Agents: ${s.agency.agents} • Technology level: ${s.agency.tech} • Missions: ${s.agency.missions} • Prestige: ${s.agency.prestige}%</p>${grid([actionCard('🧑‍💼','Hire an analyst','Recruit trained staff','agency','hire','','1 AP • $12,000'),actionCard('🛰️','Upgrade technology','Improve equipment','agency','tech','','1 AP • $30,000'),actionCard('🗣️','Run a briefing','Boost agency prestige','agency','briefing','','1 AP'),actionCard('📋','Accept contract','Fictional protective-intelligence assignment','agency','mission','','1 AP • Costs vary')])}</div>`:grid([actionCard('🕶️','Launch spy agency','Start a fictional security agency','agency','start','','1 AP • $85,000')]))+`<div class="notice">🔮 Societies in Everafter are fictional voluntary clubs. Intelligence assignments are abstract outcomes; no real surveillance or operational instructions.</div>`}
function underworldPage(){const u=s.underworld;return heading('🕶️ The Underworld','An optional fictional crime drama. Rise through a syndicate, manage notoriety and risk getting caught. Nothing here describes real-world crime methods.')+`<div class="summary-grid"><div class="summary glass"><div class="label">Criminal record</div><div class="value">${s.criminalRecord}</div></div><div class="summary glass"><div class="label">Wanted attention</div><div class="value">${u?u.heat+'%':'0%'}</div></div><div class="summary glass"><div class="label">Prison sentence</div><div class="value">${s.prison} yrs</div></div></div>`+(u?`<div class="highlight-card"><div class="eyebrow">FICTIONAL SYNDICATE</div><h2>🎩 Rank ${u.rank} of 5</h2><p>${u.crew} crew associates • Increasing rank changes your yearly share of proceeds.</p>${prog('Trust',u.trust)}${prog('Police attention',u.heat)}<div class="item-controls">${btn('🕊️ Walk away','underworld','leave','','mini-btn red')}</div></div>${section('Syndicate decisions',grid([actionCard('📦','Take an errand','Small payment, low risk','underworld','errand','','1 AP'),actionCard('🎭','Underground operation','Large potential payout, risk of prison','underworld','operation','','1 AP • High risk'),actionCard('👥','Expand the crew','Add a fictional associate','underworld','recruit','','1 AP • $3,500'),actionCard('🎩','Request promotion','Requires trust of at least 75','underworld','promote','','1 AP'),actionCard('🕊️','Keep a low profile','Reduce heat','underworld','laylow','','1 AP')]))}`:section('Start your criminal arc',grid([actionCard('🎩','Join the syndicate','Enter a fictional underground organisation','underworld','join','','1 AP')])))+section('Redemption route',grid([actionCard('🤝','Volunteer','Help repair your reputation','volunteer','','','1 AP'),actionCard('⚖️','Justice system','Prison, appeals, consequences','navigate','crime')]))}
function spacePage(){const sp=s.space;return heading('🚀 Space Program','Train, build your own spacecraft, invest in technology and attempt increasingly ambitious missions. Every launch has a cost and a chance of failure.')+`<div class="highlight-card"><div class="eyebrow">MISSION CONTROL</div><h2>🚀 ${sp.ship?'Spacecraft ready':'No spacecraft yet'}</h2><div class="grid2"><div><small>Successful missions</small><h2>${sp.missions}</h2></div><div><small>Tech level</small><h2>${sp.technology}</h2></div></div>${prog('Astronaut readiness',sp.training)}<div class="item-controls">${btn('🧑‍🚀 Train','space','train','','mini-btn primary')}${btn(sp.ship?'✅ Owns rocket':'🚀 Build rocket','space','ship','','mini-btn',sp.ship)}${btn('🛰️ Upgrade tech','space','upgrade')}</div></div>`+section('Mission board',`<div class="cards">${MISSIONS.map(m=>item(`${m.icon} ${esc(m.name)}`,`Launch cost <strong>${cash(m.cost)}</strong> • Difficulty ${m.diff}/100 • Indicative research grant ${cash(m.reward)} • Requires spacecraft and 40% readiness`,btn('🚀 Launch mission','space',m.id,'','mini-btn primary',s.age<18||!sp.ship||sp.training<40),'',m.diff>=80?'EXTREME':m.diff>=40?'CHALLENGING':'BEGINNER')).join('')}</div>`)+section('Mission history',sp.logs.length?sp.logs.map(x=>item(`${x.result==='Success'?'✅':'❌'} ${esc(x.name)}`,`Age ${x.age} • ${esc(x.result)} • Financial result ${cash(x.profit)}`)).join(''):empty('🌌','Your spaceflight story has yet to begin.'))}
function collectPage(){return heading('💎 Collections & The Auction House','Buy rare artifacts, have them appraised, uncover reproductions and watch values rise or fall. A collector’s dream, entirely unlocked.')+`<div class="summary-grid"><div class="summary glass"><div class="label">Items owned</div><div class="value">${s.collectables.length}</div></div><div class="summary glass"><div class="label">Collection value</div><div class="value">${cash(s.collectables.reduce((v,c)=>v+c.value,0))}</div></div><div class="summary glass"><div class="label">Authentic items</div><div class="value">${s.collectables.filter(c=>c.appraised&&c.authentic).length}</div></div></div>`+section('Private collection',s.collectables.length?`<div class="cards">${s.collectables.map(c=>item(`${c.icon} ${esc(c.name)}`,`Estimated value ${cash(c.value)} • ${c.appraised?(c.authentic?'✅ Authenticated':'⚠️ Reproduction'):'❔ Not yet appraised'}`,btn('🔎 Appraise $200','collect',c.uid,'appraise','mini-btn primary',c.appraised)+btn('🏛️ Exhibit','collect',c.uid,'exhibit')+btn('💰 Auction off','collect',c.uid,'sell','mini-btn red'),'','OWNED')).join('')}</div>`:empty('💎','Your display cabinets are empty. Time to bid on something unusual.'))+section('Exclusive auction listings',grid(COLLECTABLES.map(c=>actionCard(c.icon,c.name,`Market listing • Authentication risk ${Math.round(c.rarity/2)}%`,'collect',c.id,'buy',cash(c.cost),s.age<18))))+`<div class="notice">🔎 Purchasing an item never guarantees it is authentic. Appraisal reveals reproductions, which lose much of their resale value.</div>`}
const btn=(label,action,id='',extra='',cls='mini-btn',disabled=false)=>`<button class="${cls}" data-act="${esc(action)}" data-id="${esc(id)}" data-extra="${esc(extra)}" ${disabled?'disabled':''}>${label}</button>`;
function repeatHint(action,id='',extra=''){
 if(!PRACTICE_ACTIONS.has(action))return '';
 const count=s?.actionReps?.[actionKey(action,id,extra)]||0;
 const nextRate=repeatMultiplier(count);
 return `<div class="practice-hint">${count<3?'✦ Full benefits · '+(3-count)+' use'+(3-count===1?'':'s')+' left':'↘ Repeat '+(count+1)+' · '+Math.round(nextRate*100)+'% benefits'}</div>`;
}

let discoveryFilter='recommended',discoverySearch='',discoveryShown=72;
const DISCOVERY_ACTIVITY_MAP=new Map((DISCOVERY?.activities||[]).map(a=>[a.id,a]));
const DISCOVERY_PROJECT_MAP=new Map((DISCOVERY?.projects||[]).map(p=>[p.id,p]));
function discoveryAvailable(a){return s.age>=a.min&&s.age<=a.max}
function discoveryActivityList(){
 const q=discoverySearch.trim().toLowerCase();
 const base=(DISCOVERY?.activities||[]).filter(a=>{
  if(q&&!([a.title,a.desc,a.id].join(' ').toLowerCase().includes(q)))return false;
  if(discoveryFilter==='recommended')return discoveryAvailable(a);
  if(discoveryFilter!=='all'&&discoveryFilter!==a.id.split('-')[0])return false;
  return true;
 });
 const usable=base.sort((a,b)=>Number(discoveryAvailable(b))-Number(discoveryAvailable(a))||a.min-b.min||a.id.localeCompare(b.id));
 if(discoveryFilter==='recommended'&&!q){
   const seen=new Map();
   return usable.filter(a=>{
     const id=a.id.split('-')[0],count=seen.get(id)||0;
     if(count>=3)return false;
     seen.set(id,count+1);
     return true;
   });
 }
 return usable;
}
function discoveryCard(a){
 const count=s.discoveryRecords[a.id]||0;
 const available=discoveryAvailable(a);
 const rate=Math.round(repeatMultiplier(s.actionReps[actionKey('discoveryActivity',a.id)]||0)*100);
 return `<button class="discovery-card" data-act="discoveryActivity" data-id="${esc(a.id)}" ${available?'':'disabled'} aria-label="${esc(a.title)} ${available?'':'locked'}">
 <div class="discovery-card-header"><span class="d-icon">${a.icon}</span><span>${esc(a.title)}</span></div>
 <p class="discovery-card-desc">${esc(a.desc)}.</p>
 <div class="discovery-card-info"><span>${esc(a.skill)} skill</span><span>${a.cost?cash(a.cost):'Free'}</span><span>${count} times</span>
 ${!available?`<span class="locked">${s.age<a.min?'Age '+a.min+'+':'Until age '+a.max}</span>`:`<span>${rate}% next gain</span>`}</div>
 ${count?`<div class="discovery-progress"><i style="width:${Math.min(100,count*10)}%"></i></div>`:''}
 </button>`;
}
function discoveryResults(){
 const list=discoveryActivityList();
 if(!list.length)return '<p class="discovery-filter-message">Nothing found. Try a different search or category.</p>';
 const visible=list.slice(0,discoveryShown);
 const remaining=list.length-visible.length;
 return visible.map(discoveryCard).join('')+
 (remaining?`<button class="discovery-more" data-discovery-more="1">Show ${Math.min(72,remaining)} more activities <span class="discovery-more-count">(${visible.length} of ${list.length})</span></button>`:'' );
}
function discoveryProjectCard(p){
 const record=s.discoveryProjects[p.id]||{progress:0,completed:false},done=!!record.completed;
 const min=s.age>=p.min;
 return `<button class="discovery-card ${done?'complete':''}" data-act="discoveryProject" data-id="${esc(p.id)}" ${done||!min?'disabled':''}>
 <div class="discovery-card-header"><span class="d-icon">${p.icon}</span><span>${esc(p.title)}</span></div>
 <p class="discovery-card-desc">${esc(p.desc)}.</p><div class="discovery-card-info"><span>${done?'✓ Completed':record.progress+'/'+p.steps+' steps'}</span><span>${record.progress?'Already started':cash(p.cost)+' to start'}</span><span>${min?'':'Age '+p.min+'+'}</span></div>
 <div class="discovery-progress"><i style="width:${Math.round(record.progress/p.steps*100)}%"></i></div></button>`;
}
function discoveryPage(){
 const explored=Object.keys(s.discoveryRecords).length;
 const completed=Object.values(s.discoveryProjects).filter(x=>x.completed).length;
 return heading('🧭 Explore your world',`${DISCOVERY.activities.length} activities in ${DISCOVERY.categories.length} categories, plus ${DISCOVERY.projects.length} projects. Exactly ${DISCOVERY.activities.length+DISCOVERY.projects.length} things to do!`)+
 `<div class="discovery-highlights">
  <div><strong>${explored}/${DISCOVERY.activities.length}</strong><small>Experiences discovered</small></div>
  <div><strong>${completed}/${DISCOVERY.projects.length}</strong><small>Projects completed</small></div>
  <div><strong>${Object.values(s.discoveryRecords).reduce((a,b)=>a+b,0)}</strong><small>Activities attempted</small></div>
 </div>
 <div class="discovery-toolbar"><input class="discovery-search" id="discovery-search" type="search" autocomplete="off" placeholder="Search activities, hobbies, skills…" value="${esc(discoverySearch)}" aria-label="Search activities"></div>
 <div class="discovery-chips" aria-label="Activity categories">
 ${[['recommended','✨','For you'],['all','🌎','All']].concat(DISCOVERY.categories.map(c=>[c.id,c.icon,c.name])).map(([id,icon,title])=>`<button class="discovery-chip" data-discovery-filter="${id}" aria-pressed="${discoveryFilter===id}">${icon} ${esc(title)}</button>`).join('')}</div>
 <div id="discovery-results" class="discovery-grid">${discoveryResults()}</div>
 <div class="section-title"><h2>🏗️ Longer-term projects</h2><span>${DISCOVERY.projects.length} big goals</span></div>
 <p class="tip">Projects take several steps, can stretch across years and give completion rewards. Your progress autosaves.</p>
 <div class="discovery-projects">${DISCOVERY.projects.filter(p=>s.age>=p.min-4).map(discoveryProjectCard).join('')}</div>`;
}
function doDiscoveryActivity(id){
 const a=DISCOVERY_ACTIVITY_MAP.get(String(id));
 if(!a)return fail('This activity does not exist.');
 if(!discoveryAvailable(a))return fail('This activity is available from age '+a.min+(a.max<100?' to '+a.max:'')+'.');
 if(!checkFree())return;
 doAct(0,()=>{
  if(a.cost&&!spend(a.cost))return false;
  const prev=s.discoveryRecords[a.id]||0;
  s.discoveryRecords[a.id]=prev+1;
  stat(a.stat,rand(3,7));
  skill(a.skill,rand(3,6));
  if(a.focus===0)stat('discipline',2);
  else if(a.focus===1)stat('happy',2);
  else if(a.focus===2)stat('reputation',2);
  else stat('smart',2);
  if(s.age<=18&&['school','science','learning','technology'].includes(a.id.split('-')[0]))s.grades=cap(s.grades+rand(1,3));
  if(a.id.startsWith('community-')||a.id.startsWith('nature-'))s.volunteer++;
  if(a.id.startsWith('media-')){s.followers+=rand(10,130);skill('social',2)}
  if(a.id.startsWith('business-')){const earned=rand(70,310)+Math.round(s.skills.business*.6);s.cash+=earned;skill('business',2)}
  if(a.id.startsWith('friendship-')||a.id.startsWith('family-')){
   const relatives=s.relationships.filter(r=>r.alive);
   if(relatives.length)relatives[0].bond=cap(relatives[0].bond+rand(2,4));
  }
  const milestones=[10,25,50];
  if(milestones.includes(prev+1)){stat('reputation',4);log(`🌟 Mastery milestone: you completed ${a.title} ${prev+1} times!`,'event')}
  return `${a.icon} ${a.title}: ${a.desc}. Your ${a.skill} skill grew. ${prev+1} lifetime attempts.`;
 });
}
function doDiscoveryProject(id){
 const p=DISCOVERY_PROJECT_MAP.get(String(id));
 if(!p)return fail('This project does not exist.');
 if(s.age<p.min)return fail('This project unlocks at age '+p.min+'.');
 if(!checkFree())return;
 const current=s.discoveryProjects[p.id];
 if(current?.completed)return fail('You have already completed this project.');
 doAct(0,()=>{
  const record=s.discoveryProjects[p.id]||{progress:0,started:s.age,completed:false};
  if(record.progress===0&&!spend(p.cost))return false;
  record.progress++;
  skill(p.skill,rand(4,8));
  stat(p.stat,rand(2,5));
  if(record.progress>=p.steps){
   record.completed=true;record.finished=s.age;s.cash+=p.reward;
   stat('reputation',6);
   s.discoveryProjects[p.id]=record;
   return `${p.icon} PROJECT COMPLETE: ${p.title}! Your hard work paid off. Earned ${cash(p.reward)} and recognition.`;
  }
  s.discoveryProjects[p.id]=record;
  return `${p.icon} Worked on ${p.title} — step ${record.progress} of ${p.steps}. You are getting closer!`;
 });
}

function renderContent(){switch(tab){case'home':return home();case'actions':return fullScreenCategories();case'navigation':return fullMenuPage();case'stats':return extraStatsPage();case'baby':return babyPage();case'settings':return settingsPage();case'timeline':return heading('🗓️ The Full Story',`${s.log.length} recorded memories across ${s.age+1} chapters.`)+timelineList(520);case'education':return education();case'career':return careers();case'people':return people();case'activities':return activities();case'discover':return discoveryPage();case'finance':return finance();case'assets':return assets();case'business':return business();case'fame':return fame();case'politics':return politics();case'crime':return crime();case'travel':return travel();case'society':return societyPage();case'underworld':return underworldPage();case'space':return spacePage();case'collect':return collectPage();case'achievements':return achievements();case'god':return god();case'saves':return saves();default:return home()}}
function renderMobile(){return ''}
function render(){
  const previousFeed=document.querySelector('.home-feed');
  const currentKey=s?`${s.id}:${s.log.length}:${s.log[0]?.text||''}`:'';
  const previousScroll=previousFeed?{top:previousFeed.scrollTop,bottom:previousFeed.scrollHeight-previousFeed.clientHeight-previousFeed.scrollTop}:null;
  document.body.classList.toggle('everafter-home-active',!!s&&tab==='home');
  if(s)ensureExpansions(s);
  if(!s){renderSetup();document.getElementById('modal-root').innerHTML='';return}
  document.getElementById('app').innerHTML=`<div class="shell">${renderSidebar()}<main class="main">${renderTop()}${renderContent()}</main>${renderRight()}</div>${renderMobile()}`;
  if(tab==='career'&&jobQuery)filterJobList();
  if(tab==='home'){
    const feed=document.querySelector('.home-feed');
    if(feed){
      const newKey=`${s.id}:${s.log.length}:${s.log[0]?.text||''}`;
      if(previousScroll&&currentKey===newKey&&previousScroll.bottom>42)feed.scrollTop=previousScroll.top;
      else feed.scrollTop=feed.scrollHeight;
    }
  }
  if(ageFxPending&&tab==='home'){
    document.getElementById('modal-root').innerHTML='';
    document.querySelector('.birthday-scene')?.remove();
    document.body.insertAdjacentHTML('beforeend',birthdayScreen());
    clearTimeout(ageFxTimer);
    ageFxTimer=setTimeout(finishBirthday,window.matchMedia('(prefers-reduced-motion: reduce)').matches?200:(motionPreference==='fast'?1000:2700));
  }else renderModal();
}


function lifeChapterLabel(age){
 if(age===0)return 'A new beginning';
 if(age<5)return 'The wonder years';
 if(age<13)return 'Growing up';
 if(age<18)return 'Finding your feet';
 if(age<25)return 'The next adventure';
 if(age<40)return 'Making your mark';
 if(age<60)return 'The story deepens';
 return 'A lifetime of stories';
}
function buildAgeRecap(before,after){
 const changes=Object.entries(after.stats).map(([key,val])=>({key,amount:val-(before.stats[key]??val)})).filter(x=>Math.abs(x.amount)>=2).sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount));
 const milestone=after.education!==before.education?after.education:(after.job?.name||'')!==before.job?(after.job?.name||'New chapter'):lifeChapterLabel(after.age);
 return {age:after.age,cashDelta:after.cash-before.cash,changes:changes.slice(0,2),milestone,memories:Math.max(0,after.log.length-before.logLength)};
}
function recapTile(icon,label,value){
 return `<div class="recap-card"><span class="recap-icon">${icon}</span><span class="recap-text"><span class="recap-label">${esc(label)}</span><span class="recap-value">${esc(value)}</span></span></div>`;
}
function eventEffectDetails(before,after){
 const descriptions=[];
 const delta=after.cash-before.cash;
 if(delta)descriptions.push((delta>0?'+':'−')+cash(Math.abs(delta))+' cash');
 for(const [key,title] of [['health','Health'],['happy','Happiness'],['smart','Smarts'],['looks','Looks'],['fitness','Fitness'],['karma','Karma'],['reputation','Reputation'],['fame','Fame'],['discipline','Discipline']]){
   const d=(after.stats[key]||0)-(before.stats[key]||0);
   if(d)descriptions.push(title+' '+(d>0?'+':'')+d);
 }
 const grades=after.grades-before.grades;
 if(grades)descriptions.push('Grades '+(grades>0?'+':'')+grades);
 for(const key of Object.keys(after.skills).filter(key=>after.skills[key]!==before.skills[key]).slice(0,2))
   descriptions.push(key[0].toUpperCase()+key.slice(1)+' '+((after.skills[key]-before.skills[key])>0?'+':'')+(after.skills[key]-before.skills[key]));
 return descriptions.slice(0,3).join(' · ');
}

function birthdayScreen(){
  const sparks=Array.from({length:16},(_,i)=>`<span class="birthday-spark" style="--angle:${i*22.5}deg;--delay:${(i%4)*45}ms"></span>`).join('');
  return `<div class="birthday-scene" role="status" aria-label="You turned ${ageFxTo}">
    ${sparks}
    <img class="birthday-stage-art" src="assets/stages/${lifeArtStage()}.svg" alt="" aria-hidden="true"><div class="birthday-caption">✦ Chapter ${ageFxTo+1} ✦</div>
    <div class="birthday-numbers"><span class="birthday-previous" aria-hidden="true">${ageFxFrom}</span><span class="birthday-current">${ageFxTo}</span></div>
    <div class="birthday-message">Your story evolves ✨</div>
    <div class="birthday-year">${esc(lifeChapterLabel(ageFxTo))} · ${s.year}</div>
    <div class="birthday-summary" aria-label="Year recap">
      ${recapTile('🌟','YOUR CHAPTER',ageRecap?.milestone||lifeChapterLabel(ageFxTo))}
      ${recapTile('💰','CASH THIS YEAR',(ageRecap?.cashDelta||0)>=0?'+ '+cash(ageRecap?.cashDelta||0):'− '+cash(-(ageRecap?.cashDelta||0)))}
      ${ageRecap?.changes?.length?recapTile('📈','LIFE CHANGES',ageRecap.changes.map(d=>d.key+' '+(d.amount>0?'+':'')+d.amount).join(' · ')):recapTile('📖','YOUR STORY',(ageRecap?.memories||1)+' new moments')}
    </div>
    <button class="birthday-skip" data-skip-birthday="1">Continue to story ›</button>
  </div>`;
}
function finishBirthday(){
  if(!ageFxPending)return;
  ageFxPending=false;
  clearTimeout(ageFxTimer);
  document.querySelector('.birthday-scene')?.remove();
  document.querySelector('.life-home')?.classList.remove('age-playing');
  renderModal();
}
function renderModal(){
 const root=document.getElementById('modal-root');
 if(!modal){root.innerHTML='';return}
 const m=modal,isEvent=m.kind==='life-event';
 root.innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal ${m.wide?'wide':''} ${isEvent?'life-dilemma':''}" role="dialog" aria-modal="true" aria-label="${esc(m.title)}">
 ${isEvent?`<div class="event-tag">✦ Age ${s.age} · Your choice matters</div>`:''}
 ${isEvent?`<img class="event-illustration" src="${eventArtPath(m.title)}" alt="Illustration for ${esc(m.title)}">`:''}
 <div class="modal-icon">${m.icon||'✨'}</div><h2>${esc(m.title)}</h2><p>${m.body||''}</p>
 <div class="modal-actions">${(m.choices||[]).map((c,i)=>`<button class="choice" data-choice="${i}">${isEvent?`<span class="option-index">${i+1}</span>`:''}<span class="option-copy"><strong>${esc(c.text)}</strong>${c.hint?`<small>${esc(c.hint)}</small>`:''}</span><span class="arrow">›</span></button>`).join('')}</div>
 ${!m.noClose?'<button class="modal-close" data-close="1">✕ Close</button>':''}
 </div></div>`;
}
function filterJobList(){const input=document.getElementById('job-search');if(!input)return;const q=jobQuery.trim().toLowerCase();document.querySelectorAll('[data-job-search]').forEach(el=>{el.hidden=!el.dataset.jobSearch.includes(q)})}
function openMore(){const choices=NAV.flatMap(([group,items])=>items.map(([id,em,name])=>({text:`${em} ${name}`,hint:group,fn:()=>{tab=id;render()}})));choose('Explore Everafter','🗺️','Jump to any of the game systems. Nothing is locked behind payments.',choices)}
document.addEventListener('click',e=>{
 if(e.target.closest('[data-skip-birthday]')){finishBirthday();return}
 const motion=e.target.closest('[data-motion]');
 if(motion){motionPreference=motion.dataset.motion;storage.setItem('everafter_motion_v1',motionPreference);render();showToast('Birthday animation: '+motionPreference);return}
 const close=e.target.closest('[data-close]');if(close){closeDialog();return}
 const choice=e.target.closest('[data-choice]');if(choice&&modal){const c=modal.choices[Number(choice.dataset.choice)];if(c&&typeof c.fn==='function'){try{c.fn()}catch(err){console.error(err);fail('Something went wrong: '+err.message)}}return}
 const nav=e.target.closest('[data-tab]');if(nav){nav.dataset.tab==='more'?openMore():setTab(nav.dataset.tab);return}
 const discoverChip=e.target.closest('[data-discovery-filter]');if(discoverChip){discoveryFilter=discoverChip.dataset.discoveryFilter;discoveryShown=72;render();return}
 const discoverMore=e.target.closest('[data-discovery-more]');if(discoverMore){discoveryShown+=72;const results=document.getElementById('discovery-results');if(results)results.innerHTML=discoveryResults();return}
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 if(b.dataset.act==='navigate'){setTab(b.dataset.id);return}if(b.dataset.act==='goTimeline'){setTab('timeline');return}
 try{withActionContext(actionKey(b.dataset.act,b.dataset.id,b.dataset.extra),()=>act(b.dataset.act,b.dataset.id,b.dataset.extra))}catch(err){console.error(err);fail('Action error: '+err.message)}
});
document.addEventListener('change',e=>{
 if(e.target.id==='job-tier'){categoryFilter=e.target.value;render()}
 if(e.target.id==='f-avatar'){const img=document.getElementById('avatar-preview');if(img){const id=Math.max(0,EMOJIS.indexOf(e.target.value));img.src='assets/avatars/baby-'+String(id+1).padStart(2,'0')+'.svg'}}
});
document.addEventListener('input',e=>{if(e.target.id==='job-search'){jobQuery=e.target.value;filterJobList()}if(e.target.id==='discovery-search'){discoverySearch=e.target.value;discoveryShown=72;const results=document.getElementById('discovery-results');if(results)results.innerHTML=discoveryResults()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeDialog();return}if(e.key.toLowerCase()==='a'&&(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))&&!modal&&s?.alive){ageUp()}});
render();
</script></body></html>
