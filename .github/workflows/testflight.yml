name: Everafter TestFlight Upload

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - release/request-testflight.txt

permissions:
  contents: read

concurrency:
  group: everafter-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Package Everafter and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ vars.EVERAFTER_BUNDLE_ID || 'com.jdarkyeka6.everafter' }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check existing Apple API credentials
        shell: bash
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_CONTENT" ]; then
            echo "::error::Missing one or more GitHub Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT"
            exit 1
          fi
          echo "APPLE_TEAM_ID=$(printf %s "$APPLE_TEAM_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Install App Store Connect private key
        shell: bash
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          if printf '%s' "$ASC_KEY_CONTENT" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_KEY_CONTENT" > "$KEY_PATH"
          else
            ASC_KEY_CONTENT="$ASC_KEY_CONTENT" KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import base64, os, pathlib, sys
          try:
              data = base64.b64decode(''.join(os.environ['ASC_KEY_CONTENT'].split()), validate=True)
          except Exception:
              sys.exit("ASC_KEY_CONTENT must contain the .p8 PEM text or its base64 encoding")
          if b'BEGIN PRIVATE KEY' not in data:
              sys.exit("ASC_KEY_CONTENT is not a valid App Store Connect .p8 key")
          pathlib.Path(os.environ['KEY_PATH']).write_bytes(data)
          PY
          fi
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout >/dev/null
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Create Everafter icon
        shell: bash
        run: |
          set -euo pipefail
          swift scripts/make_app_icon.swift Everafter/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
          sips -s format jpeg Everafter/Assets.xcassets/AppIcon.appiconset/Icon-1024.png --out "$RUNNER_TEMP/everafter-icon.jpg" >/dev/null
          sips -s format png "$RUNNER_TEMP/everafter-icon.jpg" --out Everafter/Assets.xcassets/AppIcon.appiconset/Icon-1024.png >/dev/null

      - name: Apply the exact registered bundle ID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('project.yml')
          data = path.read_text()
          expected = 'PRODUCT_BUNDLE_IDENTIFIER: com.jdarkyeka6.everafter'
          if expected not in data:
              raise SystemExit("project.yml's default bundle ID was changed unexpectedly")
          bundle_id = os.environ["BUNDLE_ID"].strip()
          if not bundle_id or '.' not in bundle_id:
              raise SystemExit("Set the EVERAFTER_BUNDLE_ID GitHub repository variable to your registered Apple bundle ID")
          path.write_text(data.replace(expected, 'PRODUCT_BUNDLE_IDENTIFIER: ' + bundle_id))
          print('Using registered bundle ID: ' + bundle_id)
          PY

      - name: Generate Xcode project
        shell: bash
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive complete Everafter game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          test -s Everafter/Game/index.html
          xcodebuild -project Everafter.xcodeproj -scheme Everafter -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/Everafter.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive 2>&1 | tee build/archive.log

      - name: Verify game resources and Everafter branding
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/Everafter.xcarchive/Products/Applications/Everafter.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/Game/index.html" || test -s "$APP_PATH/index.html"
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP_PATH/Info.plist")
          ACTUAL_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")
          test "$DISPLAY_NAME" = "EverAfter"
          test "$ACTUAL_ID" = "$BUNDLE_ID"
          APP_INFO="$APP_PATH/Info.plist" python3 - <<'PY'
          import os, plistlib
          with open(os.environ['APP_INFO'], 'rb') as f:
              info = plistlib.load(f)
          expected_ipad = {
              'UIInterfaceOrientationPortrait',
              'UIInterfaceOrientationPortraitUpsideDown',
              'UIInterfaceOrientationLandscapeLeft',
              'UIInterfaceOrientationLandscapeRight',
          }
          iphone = info.get('UISupportedInterfaceOrientations')
          ipad = info.get('UISupportedInterfaceOrientations~ipad')
          if not isinstance(iphone, list) or 'UIInterfaceOrientationPortrait' not in iphone:
              raise SystemExit(f'Missing iPhone portrait orientation in Info.plist: {iphone!r}')
          if not isinstance(ipad, list) or not expected_ipad.issubset(ipad):
              raise SystemExit(f'Missing required iPad orientations in Info.plist: {ipad!r}')
          print('Verified iPhone portrait and all four iPad interface orientations')
          PY

      - name: Configure automatic App Store distribution signing
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA with existing Apple API key
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$PWD/build/Everafter.xcarchive" -exportPath "$PWD/build/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/export.log
          IPA_PATH=$(find "$PWD/build/export" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Apple signing did not produce a signed IPA. Check the Apple Developer Team ID, API key permissions and cloud-managed signing permissions."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload signed IPA to EverAfter TestFlight and verify Apple's response
        shell: bash
        run: |
          set -euo pipefail
          # Apple's uploader can return status 0 even when the output explicitly says UPLOAD FAILED.
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee build/upload.log
          if grep -Eiq 'UPLOAD FAILED|Failed to upload package|Validation failed|ERROR:.*\[(altool|ContentDelivery)' build/upload.log; then
            echo "::error::Apple rejected the package; inspect the upload log in workflow artifacts."
            exit 1
          fi
          if ! grep -Eiq 'UPLOAD SUCCEEDED|No errors uploading' build/upload.log; then
            echo "::error::Apple did not explicitly confirm successful upload; do not treat this run as a success."
            exit 1
          fi
          echo "Apple confirmed that the uploaded package was accepted."

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everafter-testflight-${{ github.run_number }}
          path: |
            build/archive.log
            build/export.log
            build/upload.log
          if-no-files-found: warn
